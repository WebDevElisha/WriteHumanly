<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WriteHumanly</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="../index.html" class="logo-group">
                <img src="../assets/WriteHumanly.png" alt="WriteHumanly Logo" class="logo-img">
                <span class="logo-text">WriteHumanly</span>
            </a>
            <h1>Create an Account</h1>
            <p class="auth-subtitle">Sign up to launch WriteHumanly and manage your requests.</p>
            
            <div id="error-message" class="error-message"></div>

            <form id="signup-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" required placeholder="John">
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" required placeholder="Doe">
                    </div>
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="johndoe123">
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="At least 6 characters">
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="../login/index.html">Log in</a>
            </p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
